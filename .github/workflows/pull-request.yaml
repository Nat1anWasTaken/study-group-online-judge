name: Automatic Code Quality Tests

on:
  pull_request:

jobs:
  Lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.17"

      - name: Setup Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run ruff's linter
        run: uv run ruff check .

  Format:
    name: Check formatting with Ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.17"

      - name: Setup Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run ruff's format checker
        run: uv run ruff format --check .

  Type-Check:
    name: Run static analysis with ty
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.17"

      - name: Setup Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run ty
        run: uv run ty check
